name: Daily drop

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC every day
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme (blank = next from ideas.md)'
        required: false
      date:
        description: 'Drop date YYYY-MM-DD (blank = today)'
        required: false

concurrency:
  group: daily-drop
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CI: 'true'
      THEME: ${{ inputs.theme }}
      DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: npm install -g @anthropic-ai/claude-code

      - name: Generate, validate and render
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: ./scripts/generate.sh

      - name: Upload Claude log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-log
          path: .daily/
          if-no-files-found: ignore

      - name: Commit drop and previews
        run: |
          DATE=$(cat .daily/date)
          THEME=$(node -p "require('./drops/$DATE/drop.json').theme")
          git config user.name "generative-assets[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "drops/$DATE" "public/previews/$DATE"
          git commit -m "Drop $DATE: $THEME"
          git push

      - name: Publish full-resolution files as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(cat .daily/date)
          THEME=$(node -p "require('./drops/$DATE/drop.json').theme")
          (cd out && zip -qr "../drop-$DATE.zip" "$DATE")
          gh release create "drop-$DATE" "drop-$DATE.zip" \
            --title "$DATE — $THEME" \
            --notes "Full-resolution SVG/PNG/GLB/MP4 for the **$THEME** drop. Edit any asset on the site."

  deploy:
    needs: generate
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
