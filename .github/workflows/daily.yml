name: Daily drop

on:
  schedule:
    # Off the top of the hour: GitHub delays :00 schedules by hours when busy.
    # Three runs a day. The first starts the day's kit; the later two append
    # new assets to it (same drops/<date>, see scripts/prepare-drop.ts).
    - cron: '17 6,14,22 * * *' # 06:17, 14:17, 22:17 UTC
  workflow_dispatch:
    inputs:
      theme:
        description: 'Theme (blank = next from ideas.md)'
        required: false
      date:
        description: 'Drop date YYYY-MM-DD (blank = today)'
        required: false

concurrency:
  group: daily-drop
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    outputs:
      date: ${{ steps.commit.outputs.date }}
      theme: ${{ steps.commit.outputs.theme }}
      mode: ${{ steps.commit.outputs.mode }}
    env:
      CI: 'true'
      THEME: ${{ inputs.theme }}
      DATE: ${{ inputs.date }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: npm install -g @anthropic-ai/claude-code

      - name: Generate, validate and render
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: claude-opus-5-5 # pinned: every generation runs on Opus 5.5
        run: ./scripts/generate.sh

      - name: Upload Claude log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-log
          path: .daily/
          if-no-files-found: ignore

      - name: Commit the drop (source only; everything renders on demand in the browser)
        id: commit
        run: |
          DATE=$(cat .daily/date)
          THEME=$(node -p "require('./drops/$DATE/drop.json').theme")
          { echo "date=$DATE"; echo "theme=$THEME"; echo "mode=$(cat .daily/mode)"; } >> "$GITHUB_OUTPUT"
          git config user.name "openassets[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "drops/$DATE"
          if [ "$(cat .daily/mode)" = append ]; then
            git commit -m "Drop $DATE: add assets to $THEME"
          else
            git commit -m "Drop $DATE: $THEME"
          fi
          # main may have moved during the hour-long generation; replay on top.
          git pull --rebase origin main
          git push

  deploy:
    needs: generate
    uses: ./.github/workflows/deploy.yml
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write

  # Push to the phone (Exploud): the kit link once it is live, or the run when something broke.
  notify:
    needs: [generate, deploy]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - name: Kit is live
        if: needs.generate.result == 'success' && needs.deploy.result == 'success'
        uses: ./.github/actions/exploud
        with:
          endpoint: ${{ secrets.EXPLOUD_URL }}
          token: ${{ secrets.EXPLOUD_TOKEN }}
          source: openassets
          title: >-
            ${{ needs.generate.outputs.mode == 'append' && format('New assets in {0}', needs.generate.outputs.theme) || format('New kit: {0}', needs.generate.outputs.theme) }}
          body: Drop ${{ needs.generate.outputs.date }} is live on the site.
          url: https://arnabchatterjee20k.github.io/openassets/#/kit/${{ needs.generate.outputs.date }}
      - name: Drop failed
        if: needs.generate.result == 'failure' || needs.deploy.result == 'failure'
        uses: ./.github/actions/exploud
        with:
          endpoint: ${{ secrets.EXPLOUD_URL }}
          token: ${{ secrets.EXPLOUD_TOKEN }}
          source: openassets
          title: Daily drop failed
          body: ${{ needs.generate.result == 'failure' && 'Generation failed' || 'Deploying the site failed' }}. Tap for the run log.
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
